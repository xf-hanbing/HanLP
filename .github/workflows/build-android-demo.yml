name: Build Android Demo

on:
  workflow_dispatch:
    inputs:
      quantize:
        type: boolean
        description: "Enable quantization"
        default: true
      quant_mode:
        type: choice
        description: "Quantization mode when enabled"
        default: float16
        options:
          - float16
          - int8
          - full-int8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.13.1 transformers==4.57.3 sentencepiece h5py numpy \
            hanlp-common hanlp-trie hanlp-downloader termcolor toposort packaging filelock
          pip install -e ".[full]"

      - name: Download NER model
        run: |
          curl -L -o ner_model.zip https://ftp.hankcs.com/hanlp/ner/ner_albert_base_zh_msra_20200111_202919.zip
          unzip -q ner_model.zip

      - name: Download tokenizer and base model
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer, TFAutoModel

          model_name = "uer/albert-base-chinese-cluecorpussmall"
          AutoTokenizer.from_pretrained(model_name, use_fast=False).save_pretrained("hf_albert_base_zh")
          TFAutoModel.from_pretrained(model_name).save_pretrained("hf_albert_base_zh")
          PY

      - name: Resolve quantization settings
        id: quant
        run: |
          quantize="${{ github.event.inputs.quantize || 'true' }}"
          mode="${{ github.event.inputs.quant_mode || 'float16' }}"
          if [ "$quantize" != "true" ]; then
            quant="none"
            full_int8="false"
            tag="float32"
          else
            if [ "$mode" = "full-int8" ]; then
              quant="int8"
              full_int8="true"
              tag="full_int8"
            else
              quant="$mode"
              full_int8="false"
              tag="$mode"
            fi
          fi
          echo "quant=$quant" >> "$GITHUB_OUTPUT"
          echo "full_int8=$full_int8" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Export TFLite
        run: |
          args=(
            --model-dir ner_albert_base_zh_msra_20200111_202919
            --export-dir export/ner_albert_msra
            --tflite-path "export/ner_albert_msra/ner_${{ steps.quant.outputs.tag }}.tflite"
            --quant "${{ steps.quant.outputs.quant }}"
          )
          if [ "${{ steps.quant.outputs.full_int8 }}" = "true" ]; then
            args+=(--full-int8 --rep-data tools/rep_text_zh.txt)
          fi
          python tools/export_ner_tflite.py "${args[@]}"

      - name: Copy assets into Android app
        run: |
          mkdir -p android/app/src/main/assets
          cp "export/ner_albert_msra/ner_${{ steps.quant.outputs.tag }}.tflite" \
            android/app/src/main/assets/ner_float16.tflite
          cp export/ner_albert_msra/labels.txt android/app/src/main/assets/labels.txt
          cp hf_albert_base_zh/vocab.txt android/app/src/main/assets/vocab.txt

      - name: Package resources
        run: |
          bundle_dir="export/ner_albert_msra/resources_${{ steps.quant.outputs.tag }}"
          mkdir -p "$bundle_dir"
          cp "export/ner_albert_msra/ner_${{ steps.quant.outputs.tag }}.tflite" "$bundle_dir/"
          cp export/ner_albert_msra/labels.txt "$bundle_dir/"
          cp export/ner_albert_msra/meta.json "$bundle_dir/"
          cp hf_albert_base_zh/vocab.txt "$bundle_dir/"
          (cd "$bundle_dir" && zip -r "../hanlp_ner_assets_${{ steps.quant.outputs.tag }}.zip" .)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Build APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: "8.1.1"
          arguments: ":app:assembleDebug"
          build-root-directory: android

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hanlp-ner-demo-${{ steps.quant.outputs.tag }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            export/ner_albert_msra/ner_${{ steps.quant.outputs.tag }}.tflite
            export/ner_albert_msra/labels.txt
            export/ner_albert_msra/meta.json
            export/ner_albert_msra/hanlp_ner_assets_${{ steps.quant.outputs.tag }}.zip
            hf_albert_base_zh/vocab.txt
