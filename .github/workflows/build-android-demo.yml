name: Build Android Demo

on:
  workflow_dispatch:
    inputs:
      quantize:
        type: boolean
        description: "Enable quantization"
        default: true
      quant_mode:
        type: choice
        description: "Quantization mode when enabled"
        default: float16
        options:
          - float16
          - int8
          - full-int8
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      USE_TORCH: "0"
      USE_TF: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow==2.13.1 transformers==4.57.3 sentencepiece h5py numpy

      - name: Download NER model
        run: |
          curl -L -o ner_model.zip https://ftp.hankcs.com/hanlp/ner/ner_albert_base_zh_msra_20200111_202919.zip
          unzip -q ner_model.zip

      - name: Download tokenizer and base model
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer, TFAutoModel

          model_name = "uer/albert-base-chinese-cluecorpussmall"
          AutoTokenizer.from_pretrained(model_name, use_fast=False).save_pretrained("albert_base_zh")
          TFAutoModel.from_pretrained(model_name).save_pretrained("albert_base_zh")
          PY

      - name: Resolve quantization settings
        id: quant
        run: |
          quantize="${{ github.event.inputs.quantize || 'true' }}"
          mode="${{ github.event.inputs.quant_mode || 'float16' }}"
          if [ "$quantize" != "true" ]; then
            mode="none"
          else
            if [ "$mode" != "float16" ] && [ "$mode" != "int8" ] && [ "$mode" != "full-int8" ] && [ "$mode" != "all" ]; then
              mode="float16"
            fi
          fi
          case "$mode" in
            none) tag="float32" ;;
            full-int8) tag="full_int8" ;;
            all) tag="all" ;;
            *) tag="$mode" ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Export TFLite
        run: |
          run_export() {
            local tag="$1"
            local quant="$2"
            local full_int8="$3"
            args=(
              --model-dir ner_albert_base_zh_msra_20200111_202919
              --base-model albert_base_zh
              --export-dir export/ner_albert_msra
              --tflite-path "export/ner_albert_msra/ner_${tag}.tflite"
              --quant "$quant"
              --max-seq-length 128
            )
            if [ "$full_int8" = "true" ]; then
              args+=(--full-int8 --rep-data tools/rep_text_zh.txt)
            fi
            python tools/export_ner_tflite_legacy_albert.py "${args[@]}"
          }

          mode="${{ steps.quant.outputs.mode }}"
          if [ "$mode" = "all" ]; then
            run_export "float16" "float16" "false"
            run_export "int8" "int8" "false"
            run_export "full_int8" "int8" "true"
          elif [ "$mode" = "full-int8" ]; then
            run_export "full_int8" "int8" "true"
          elif [ "$mode" = "int8" ]; then
            run_export "int8" "int8" "false"
          elif [ "$mode" = "none" ]; then
            run_export "float32" "none" "false"
          else
            run_export "float16" "float16" "false"
          fi

      - name: Copy assets into Android app
        run: |
          mkdir -p android/app/src/main/assets
          mode="${{ steps.quant.outputs.mode }}"
          if [ "$mode" = "all" ]; then
            cp export/ner_albert_msra/ner_float16.tflite android/app/src/main/assets/ner_float16.tflite
            cp export/ner_albert_msra/ner_int8.tflite android/app/src/main/assets/ner_int8.tflite
            cp export/ner_albert_msra/ner_full_int8.tflite android/app/src/main/assets/ner_full_int8.tflite
          else
            cp "export/ner_albert_msra/ner_${{ steps.quant.outputs.tag }}.tflite" \
              "android/app/src/main/assets/ner_${{ steps.quant.outputs.tag }}.tflite"
          fi
          cp export/ner_albert_msra/labels.txt android/app/src/main/assets/labels.txt
          cp albert_base_zh/vocab.txt android/app/src/main/assets/vocab.txt

      - name: Package resources
        run: |
          bundle_dir="export/ner_albert_msra/resources_${{ steps.quant.outputs.tag }}"
          mkdir -p "$bundle_dir"
          mode="${{ steps.quant.outputs.mode }}"
          if [ "$mode" = "all" ]; then
            cp export/ner_albert_msra/ner_float16.tflite "$bundle_dir/"
            cp export/ner_albert_msra/ner_int8.tflite "$bundle_dir/"
            cp export/ner_albert_msra/ner_full_int8.tflite "$bundle_dir/"
          else
            cp "export/ner_albert_msra/ner_${{ steps.quant.outputs.tag }}.tflite" "$bundle_dir/"
          fi
          cp export/ner_albert_msra/labels.txt "$bundle_dir/"
          cp export/ner_albert_msra/meta.json "$bundle_dir/"
          cp albert_base_zh/vocab.txt "$bundle_dir/"
          (cd "$bundle_dir" && zip -r "../hanlp_ner_assets_${{ steps.quant.outputs.tag }}.zip" .)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Build APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: "8.1.1"
          arguments: ":app:assembleDebug"
          build-root-directory: android

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hanlp-ner-demo-${{ steps.quant.outputs.tag }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            export/ner_albert_msra/ner_*.tflite
            export/ner_albert_msra/labels.txt
            export/ner_albert_msra/meta.json
            export/ner_albert_msra/hanlp_ner_assets_${{ steps.quant.outputs.tag }}.zip
            albert_base_zh/vocab.txt
